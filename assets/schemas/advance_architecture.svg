<svg width="1200" height="780" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="780" fill="#0a0f1c"/>

  <!-- Title -->
  <text x="600" y="60" font-size="36" fill="#e11d48" text-anchor="middle" font-family="Arial Black">
    Architecture Opérationnelle Avancée — BisAT
  </text>

  <!-- Central Fusion Matrix -->
  <rect x="450" y="260" width="300" height="200" fill="#1e3a8a" stroke="#e11d48" stroke-width="6"/>
  <text x="600" y="360" font-size="26" fill="#fff" text-anchor="middle">Matrice Fusion</text>

  <!-- SIGINT -->
  <rect x="80" y="140" width="220" height="120" fill="#1e3a8a"/>
  <text x="190" y="200" fill="#fff" font-size="22" text-anchor="middle">SIGINT</text>

  <!-- HUMINT -->
  <rect x="80" y="360" width="220" height="120" fill="#1e3a8a"/>
  <text x="190" y="420" fill="#fff" font-size="22" text-anchor="middle">HUMINT</text>

  <!-- CyberOps -->
  <rect x="900" y="140" width="220" height="120" fill="#1e3a8a"/>
  <text x="1010" y="200" fill="#fff" font-size="22" text-anchor="middle">CyberOps</text>

  <!-- Atlas -->
  <rect x="900" y="360" width="220" height="120" fill="#1e3a8a"/>
  <text x="1010" y="420" fill="#fff" font-size="22" text-anchor="middle">Atlas</text>

  <!-- Arrows -->
  <line x1="300" y1="200" x2="450" y2="300" stroke="#e11d48" stroke-width="6"/>
  <line x1="300" y1="420" x2="450" y2="360" stroke="#e11d48" stroke-width="6"/>
  <line x1="750" y1="300" x2="900" y2="200" stroke="#e11d48" stroke-width="6"/>
  <line x1="750" y1="360" x2="900" y2="420" stroke="#e11d48" stroke-width="6"/>

  <!-- Feedback loops -->
  <path d="M190 480 C300 600 900 600 1010 480" stroke="#e11d48" stroke-width="4" fill="none"/>
</svg>
